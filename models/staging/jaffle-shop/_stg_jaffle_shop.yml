models:
  - name: stg_jaffle_shop__customers
    description: the grain of this table is one cusotmer per line
    columns:
      - name: customer_id
        description: this is primary key for this data
        data_tests:
          - unique
          - not_null
      - name: first_name
        data_tests:
          - not_null
      - name: last_name
        data_tests:
          - not_null
      
          
  - name: stg_jaffle_shop__orders
    description: one order per row
    columns:
      - name: order_id
        description: this is primary key for this data
        data_tests:
          - unique
          - not_null
      - name: status
        description: "{{ doc('order_status') }}"
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - shipped
                  - returned
                  - placed
                  - return_pending
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                field: customer_id
                to: ref('stg_jaffle_shop__customers')
